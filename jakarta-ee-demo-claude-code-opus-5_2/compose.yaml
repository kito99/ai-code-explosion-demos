services:
  leaderboard-db:
    container_name: jakarta-ee-demo-claude-code-opus-5_2-db
    image: postgres:18.6
    environment:
      POSTGRES_DB: dukeguess
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
    ports:
      # 5435 on the host keeps this demo clear of a default PostgreSQL and of the other
      # demos in this repository, which take 5432 through 5434.
      - "5435:5432"
    volumes:
      # PostgreSQL 18 keeps its data in a versioned subdirectory, so the mount point is the
      # parent rather than the /var/lib/postgresql/data of earlier releases.
      - leaderboard-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d dukeguess"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  leaderboard-data:
