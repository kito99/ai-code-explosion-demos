<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaderboard &ndash; Guess the Number with Duke</title>
    <link rel="icon" href="img/duke-standing.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="site-header">
    <h1>Leaderboard</h1>
    <nav aria-label="Main"><a href="index.html">Back to the game</a></nav>
</header>

<main class="leaderboard">
    <p class="lede">The best ten results on this server, fewest guesses first.</p>
    <p class="message" id="leaderboard-message" role="status" aria-live="polite">Loading the leaderboard&hellip;</p>

    <table id="leaderboard-table" hidden>
        <caption class="visually-hidden">Winning results, ranked by fewest guesses</caption>
        <thead>
        <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Guesses</th>
        </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>

    <div class="actions">
        <a class="button-link" href="index.html">Play again</a>
    </div>
</main>

<footer class="site-footer">
    <p>Duke artwork from the <a href="https://github.com/openjdk/duke">OpenJDK Duke project</a>.</p>
</footer>

<script src="js/leaderboard.js"></script>
</body>
</html>
