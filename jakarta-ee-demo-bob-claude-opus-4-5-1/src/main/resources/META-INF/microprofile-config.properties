# MicroProfile Config for Guess the Number
#
# Telemetry defaults: export traces and metrics to the console (logging exporter).
# To point at a real OTLP collector, change these two properties:
#   otel.exporter.otlp.endpoint=http://your-collector:4317
#   otel.traces.exporter=otlp
#   otel.metrics.exporter=otlp
#   otel.logs.exporter=otlp

otel.service.name=guess-the-number
otel.traces.exporter=logging
otel.metrics.exporter=logging
otel.logs.exporter=logging

# Disable the default OTLP export (no collector required by default)
otel.sdk.disabled=false
