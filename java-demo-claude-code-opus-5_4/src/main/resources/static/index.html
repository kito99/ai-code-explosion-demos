    <div class="play">
      <p class="message" id="message" role="status" aria-live="polite"></p>

      <!-- novalidate so every guess reaches the server, which is the one place
           that decides what counts. The min/max/step still drive the spinner. -->
      <form class="guess-form" id="guessForm" autocomplete="off" novalidate>
        <label class="guess-form__label" for="guessInput">Your guess (1&ndash;10)</label>
        <div class="guess-form__row">
          <input class="guess-form__input" id="guessInput" name="guess" type="number"
                 min="1" max="10" step="1" inputmode="numeric">
          <button class="button button--primary" id="guessButton" type="submit">Guess</button>
        </div>
      </form>

      <form class="name-form" id="nameForm" autocomplete="off" hidden novalidate>
        <label class="name-form__label" for="nameInput">Post your score as</label>
        <div class="name-form__row">
          <input class="name-form__input" id="nameInput" name="name" type="text" maxlength="30"
                 placeholder="Your name">
          <button class="button button--primary" id="postButton" type="submit">Post score</button>
        </div>
        <p class="message message--small" id="scoreMessage" role="status" aria-live="polite"></p>
      </form>

      <dl class="tally">
        <div class="tally__item"><dt>Guesses made</dt><dd id="guessesMade">0</dd></div>
        <div class="tally__item"><dt>Guesses left</dt><dd id="guessesRemaining">5</dd></div>
      </dl>

      <button class="button" id="newGameButton" type="button">Play again</button>
    </div>
  </section>
</main>
<script src="duke.js"></script>
</body>
</html>
