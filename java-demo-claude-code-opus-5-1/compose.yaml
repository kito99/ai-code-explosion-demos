services:
  db:
    image: postgres:18
    container_name: duke-guess-db
    environment:
      POSTGRES_DB: dukedb
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d dukedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 keeps its data in a subdirectory, so the mount goes one level up.
      - duke-pgdata:/var/lib/postgresql

volumes:
  duke-pgdata:
