services:
  db:
    image: postgres:18
    container_name: java-demo-bob-claude-opus-4-5_3-db
    environment:
      POSTGRES_DB: guessgame
      POSTGRES_USER: guessgame
      POSTGRES_PASSWORD: guessgame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guessgame -d guessgame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
