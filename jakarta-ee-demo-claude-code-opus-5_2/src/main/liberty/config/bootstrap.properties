# Runtime-level OpenTelemetry configuration, so the exported telemetry covers the Liberty
# runtime as well as the application. Switch the three exporters to otlp and set
# otel.exporter.otlp.endpoint to send this to a real collector instead of the console.
otel.sdk.disabled=false
otel.service.name=jakarta-ee-demo-claude-code-opus-5_2
otel.traces.exporter=console
otel.metrics.exporter=console
otel.logs.exporter=console

# Short delays keep a demo readable: spans show up about a second after the request that
# produced them, and metrics are reported every ten seconds.
otel.bsp.schedule.delay=1000
otel.metric.export.interval=10000
