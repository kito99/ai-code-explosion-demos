services:
  leaderboard-db:
    container_name: jakarta-ee-demo-copilot-cli-sonnet-5-5_1-db
    image: postgres:18.6
    environment:
      POSTGRES_DB: guessdb
      POSTGRES_USER: guess
      POSTGRES_PASSWORD: guess
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - leaderboard-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guess -d guessdb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  leaderboard-data:
