<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guess the Number with Duke</title>
    <meta name="description" content="Duke is thinking of a number between 1 and 10. Can you find it in five guesses?">
    <link rel="icon" href="images/duke-favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="game" id="game">
    <header class="game__header">
        <h1 class="game__title">Guess the Number</h1>
        <p class="game__subtitle">Duke picked a number between 1 and 10. You get five tries.</p>
    </header>

    <div class="stage">
        <div class="stage__backdrop" aria-hidden="true"></div>

        <!--
          Duke is inline SVG rather than an image file so the celebration can animate
          his body and waving arm as separate pieces.
        -->
        <svg class="duke" id="duke" viewBox="0 0 200 250" role="img"
             aria-labelledby="duke-title" xmlns="http://www.w3.org/2000/svg">
            <title id="duke-title">Duke, the Java mascot, thinking of a number</title>

            <ellipse class="duke__shadow" cx="100" cy="224" rx="54" ry="10"></ellipse>

            <g class="duke__body">
                <!--
                  Arms come first so the torso hides where they join, and each is a dark
                  stroke with a white one laid over it to read as an outlined white limb.
                -->
                <g class="duke__arm duke__arm--resting">
                    <path class="duke__limb-outline" d="M70,120 L34,150" />
                    <path class="duke__limb-fill" d="M70,120 L34,150" />
                </g>

                <g class="duke__arm duke__arm--waving">
                    <path class="duke__limb-outline" d="M130,118 L168,86" />
                    <path class="duke__limb-fill" d="M130,118 L168,86" />
                </g>

                <path class="duke__torso"
                      d="M100,50
                         C126,50 139,67 141,82
                         C146,122 157,176 164,194
                         C169,205 163,214 152,214
                         L48,214
                         C37,214 31,205 36,194
                         C43,176 54,122 59,82
                         C61,67 74,50 100,50 Z" />

                <!--
                  The nose goes in front of the torso, so the whole red triangle reads as
                  a feature on Duke's face with the tip rising past the top of his head.
                -->
                <path class="duke__nose" d="M100,14 L126,88 L74,88 Z" />

                <ellipse class="duke__eye" cx="84" cy="104" rx="6" ry="9" />
                <ellipse class="duke__eye" cx="116" cy="104" rx="6" ry="9" />
            </g>
        </svg>
    </div>

    <!-- The one line that tells the player what just happened and what to do next. -->
    <p class="message" id="message" role="status" aria-live="polite">
        Waking Duke up&hellip;
    </p>

    <section class="tracker" aria-label="Guesses">
        <ol class="pips" id="pips" aria-hidden="true">
            <li class="pip"></li>
            <li class="pip"></li>
            <li class="pip"></li>
            <li class="pip"></li>
            <li class="pip"></li>
        </ol>
        <p class="tracker__count" id="tracker-count">0 guesses made &middot; 5 left</p>
    </section>

    <form class="guess-form" id="guess-form" novalidate>
        <label class="guess-form__label" for="guess">Your guess, a number from 1 to 10</label>
        <div class="guess-form__row">
            <!--
              Deliberately a text field: the player can submit anything, and the server
              decides what counts as a guess.
            -->
            <input class="guess-form__input" id="guess" name="guess" type="text"
                   inputmode="numeric" autocomplete="off" autocapitalize="off"
                   spellcheck="false" maxlength="4" aria-describedby="message">
            <button class="btn btn--primary" id="submit-guess" type="submit">Guess</button>
        </div>
    </form>

    <button class="btn btn--ghost" id="play-again" type="button">Play again</button>
</main>

<script src="js/app.js"></script>
</body>
</html>
