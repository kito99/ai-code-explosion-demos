services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dukedb
      POSTGRES_USER: duke
      POSTGRES_PASSWORD: duke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duke -d dukedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
