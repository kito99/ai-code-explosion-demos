name: java-demo-claude-code-opus-5-4

services:
  postgres:
    image: postgres:18
    container_name: java-demo-claude-code-opus-5_4-postgres
    environment:
      POSTGRES_DB: guessduke
      POSTGRES_USER: guessduke
      POSTGRES_PASSWORD: guessduke
    ports:
      - "5436:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA under /var/lib/postgresql/18, so the whole
      # directory is the volume rather than the old /var/lib/postgresql/data.
      - java-demo-claude-code-opus-5_4-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guessduke -d guessduke"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  java-demo-claude-code-opus-5_4-pgdata:
