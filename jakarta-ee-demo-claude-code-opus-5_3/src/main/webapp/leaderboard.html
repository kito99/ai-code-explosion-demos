<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaderboard &ndash; Guess the Number with Duke</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="images/duke-thinking.svg" type="image/svg+xml">
</head>
<body>
<main class="card">
    <header class="card-header">
        <h1>Leaderboard</h1>
        <p class="subtitle">Best wins, fewest guesses first.</p>
    </header>

    <p class="message" id="empty-message" role="status" aria-live="polite" hidden></p>

    <table class="leaderboard" id="leaderboard" hidden>
        <caption class="visually-hidden">Top 10 wins ranked by fewest guesses</caption>
        <thead>
        <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Guesses</th>
        </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>

    <div class="actions">
        <a class="link-button" href="index.html">Back to the game</a>
    </div>
</main>

<script src="js/leaderboard.js"></script>
</body>
</html>
