<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the Number with Duke</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Guess the Number with Duke</h1>
  <nav><a href="leaderboard.html">View the leaderboard</a></nav>
  <section class="card">
    <div class="duke-stage"><img id="duke" class="duke" src="img/Thinking.svg" alt="Duke, the Java mascot, thinking of a number"></div>
    <p id="message" role="status" aria-live="polite">Loading game…</p>
    <div class="counts" id="counts">
      <span>Guesses made: <span id="made">0</span></span>
      <span>Guesses remaining: <span id="remaining">5</span></span>
    </div>
    <form id="guess-form">
      <div style="flex:1">
        <label for="guess">Your guess (1–10)</label>
        <input id="guess" name="guess" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <button type="submit" id="guess-btn" style="align-self:flex-end">Guess</button>
    </form>
    <form id="name-form" hidden>
      <div style="flex:1">
        <label for="name">Your name (up to 30 characters)</label>
        <input id="name" name="name" type="text" autocomplete="off">
      </div>
      <button type="submit" id="post-btn" style="align-self:flex-end">Post score</button>
    </form>
    <p style="text-align:center"><button type="button" id="new-game" class="secondary">Play again</button></p>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
