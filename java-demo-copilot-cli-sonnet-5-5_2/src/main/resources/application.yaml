spring:
  application:
    name: java-demo-copilot-cli-sonnet-5-5_2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duke}
    username: ${DB_USER:duke}
    password: ${DB_PASSWORD:duke}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
