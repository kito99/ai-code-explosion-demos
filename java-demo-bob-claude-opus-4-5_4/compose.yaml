services:
  db:
    image: postgres:18
    container_name: java-demo-bob-claude-opus-4-5_4-db
    environment:
      POSTGRES_DB: guessdb
      POSTGRES_USER: guessuser
      POSTGRES_PASSWORD: guesspass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guessuser -d guessdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
