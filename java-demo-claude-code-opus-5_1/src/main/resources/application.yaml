spring:
  application:
    name: java-demo-claude-code-opus-5_1
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # A fractional guess is not a whole number, so it must not be truncated into one.
      accept-float-as-int: false
  datasource:
    url: jdbc:postgresql://localhost:5432/dukedb
    username: duke
    password: duke
  jpa:
    open-in-view: false
    hibernate:
      # The leaderboard table is created from the mapped entity, so a fresh database needs no setup.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

logging:
  structured:
    format:
      # Structured JSON on the console, with trace and span ids on every line.
      console: ecs

management:
  observations:
    annotations:
      # Turns the @Observed service methods into spans and timers.
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      # Every request is sampled: this is a demo, not a busy production service.
      probability: 1.0
  otlp:
    metrics:
      export:
        # Off by default so nothing tries to reach a collector that is not running.
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

duke:
  game:
    session-timeout: 30m
    cleanup-interval: 5m
  telemetry:
    console-traces: true
    console-metrics: true
    console-metrics-interval: 30s
