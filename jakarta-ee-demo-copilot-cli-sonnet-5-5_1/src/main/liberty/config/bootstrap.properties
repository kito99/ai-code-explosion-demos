# Runtime-level OpenTelemetry configuration, so the exported telemetry covers both the
# Liberty runtime and the application. Point otel.*.exporter at otlp and set
# otel.exporter.otlp.endpoint to send this to a real collector instead of the console.
otel.sdk.disabled=false
otel.service.name=jakarta-ee-demo-copilot-cli-sonnet-5-5_1
otel.traces.exporter=console
otel.metrics.exporter=console
otel.logs.exporter=console

# Short delays keep a demo readable: spans appear about a second after a request, and
# metrics are reported every ten seconds.
otel.bsp.schedule.delay=1000
otel.metric.export.interval=10000
