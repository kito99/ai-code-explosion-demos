<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guess the Number with Duke</title>
    <link rel="icon" href="images/duke-thinking.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="game" id="game">
    <h1>Guess the Number with Duke</h1>

    <div class="stage">
        <img id="duke" class="duke" data-pose="thinking" src="images/duke-thinking.svg"
             width="145" height="148"
             alt="Duke, thinking of a number">
    </div>

    <p id="message" class="message" role="status" aria-live="polite">
        Duke is thinking of a number from 1 to 10. You have 5 guesses.
    </p>

    <form id="guess-form" class="guess-form" novalidate>
        <label class="guess-label" for="guess">Your guess</label>
        <input id="guess" class="guess-input" name="guess" type="text" inputmode="numeric"
               autocomplete="off" aria-describedby="message scoreboard">
        <button id="submit-guess" class="button primary" type="submit">Guess</button>
    </form>

    <p id="scoreboard" class="scoreboard">
        <span id="guesses-made">0</span> guesses made ·
        <span id="guesses-remaining">5</span> left
    </p>

    <button id="new-game" class="button" type="button">New game</button>

    <footer class="credit">
        Duke is by the <a href="https://github.com/openjdk/duke">OpenJDK Duke project</a>.
    </footer>
</main>
<script src="js/app.js"></script>
</body>
</html>
