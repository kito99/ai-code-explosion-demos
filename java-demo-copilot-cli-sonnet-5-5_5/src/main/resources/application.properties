spring.application.name=java-demo-copilot-cli-sonnet-5-5_5
server.port=8085

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5445/duke}
spring.datasource.username=${DB_USER:duke}
spring.datasource.password=${DB_PASSWORD:duke}

# Creates the leaderboard table on startup (schema.sql is idempotent)
spring.sql.init.mode=always
