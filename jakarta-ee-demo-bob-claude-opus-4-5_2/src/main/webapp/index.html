<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guess the Number with Duke</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Guess the Number with Duke</h1>
    <nav>
      <a href="index.html" class="nav-link active">Game</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
    </nav>
  </header>

  <main>
    <section class="duke-section" aria-label="Duke character">
      <img id="duke-img"
           src="images/duke-thinking.svg"
           alt="Duke is thinking of a number"
           class="duke-image"/>
    </section>

    <section class="game-section">
      <p id="status-message" class="status-message" aria-live="polite">
        Duke is thinking of a number between 1 and 10. Can you guess it?
      </p>

      <div id="score-info" class="score-info" aria-live="polite"></div>

      <div id="guess-form" class="guess-form">
        <label for="guess-input" class="sr-only">Enter your guess (1–10)</label>
        <input id="guess-input"
               type="number"
               min="1"
               max="10"
               step="1"
               placeholder="1 – 10"
               aria-label="Your guess"
               autocomplete="off"/>
        <button id="guess-btn" type="button">Guess!</button>
      </div>

      <!-- Win: name entry -->
      <div id="win-form" class="win-form hidden">
        <p class="win-prompt">🎉 You won! Enter your name to post your score:</p>
        <label for="name-input" class="sr-only">Your name</label>
        <input id="name-input"
               type="text"
               maxlength="30"
               placeholder="Your name (max 30 chars)"
               aria-label="Your name"/>
        <button id="post-btn" type="button">Post Score</button>
        <p id="name-error" class="error-msg hidden" aria-live="polite"></p>
      </div>

      <div id="end-actions" class="end-actions hidden">
        <button id="new-game-btn" type="button">Play Again</button>
      </div>

      <!-- Always-visible play-again for mid-game restart -->
      <div class="mid-game-actions">
        <button id="restart-btn" type="button" class="secondary">Start New Game</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
