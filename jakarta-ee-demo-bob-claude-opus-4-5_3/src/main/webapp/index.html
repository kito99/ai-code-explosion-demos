<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Guess the Number with Duke</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="container">
    <header>
        <h1>Guess the Number with Duke!</h1>
        <p class="subtitle">I'm thinking of a number between 1 and 10 — can you guess it?</p>
    </header>

    <!-- Duke image -->
    <div class="duke-area">
        <img id="duke-img"
             src="images/duke-thinking.svg"
             alt="Duke, the Java mascot, thinking of a number"
             class="duke"/>
    </div>

    <!-- Status / feedback -->
    <div id="status-message" class="status-message" aria-live="polite"></div>

    <!-- Guess count (FR-8) -->
    <div id="guess-counter" class="guess-counter" aria-live="polite"></div>

    <!-- Guess input (FR-5) — hidden when game is not active -->
    <div id="guess-form" class="guess-form">
        <label for="guess-input" class="sr-only">Enter your guess (1–10)</label>
        <input id="guess-input"
               type="number" min="1" max="10"
               placeholder="1 – 10"
               aria-label="Your guess"
               autocomplete="off"/>
        <button id="guess-btn" onclick="submitGuess()">Guess!</button>
    </div>

    <!-- Win score form (FR-13, FR-14) — shown only after a win -->
    <div id="score-form" class="score-form hidden">
        <label for="name-input">Enter your name to post your score:</label>
        <input id="name-input"
               type="text"
               maxlength="30"
               placeholder="Your name (up to 30 characters)"
               aria-label="Your name"/>
        <button id="post-btn" onclick="postScore()">Post Score</button>
        <div id="name-error" class="error-msg" aria-live="polite"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="new-game-btn" onclick="startNewGame()">New Game</button>
        <a href="leaderboard.html" class="leaderboard-link">🏆 Leaderboard</a>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
